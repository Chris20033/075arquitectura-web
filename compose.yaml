name: 075arquitectura

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: arquitectura
      POSTGRES_USER: arquitectura
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquitectura -d arquitectura"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: arquitectura_test
      POSTGRES_USER: arquitectura_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U arquitectura_test -d arquitectura_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres_data:
